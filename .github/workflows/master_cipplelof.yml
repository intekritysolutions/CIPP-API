name: Build and deploy Powershell project to Azure Function App - cipplelof
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'cipplelof'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DB1837949E224BCCBC780F31E64A5CF0 }}

  set-package-url:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set WEBSITE_RUN_FROM_PACKAGE to storage URL
        uses: azure/CLI@v1
        with:
          inlineScript: |
            EXPIRY=$(date -u -d "+5 years" '+%Y-%m-%dT%H:%M:%SZ')
            SAS=$(az storage blob generate-sas \
              --account-name cippstglelof \
              --container-name cipplelof-applease \
              --name cipplelof.zip \
              --permissions r \
              --expiry $EXPIRY \
              --https-only \
              --full-uri \
              --output tsv)
            az functionapp config appsettings set \
              --name cipplelof \
              --resource-group CIPP \
              --settings "WEBSITE_RUN_FROM_PACKAGE=$SAS"
